<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="le-token" content="{{TOKEN}}">
  <title>Loose Ends</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5c3 0 3 6 6 6s3-6 6-6"/><circle cx="2" cy="5" r="1"/></svg>
      </span>
      <h1>Loose Ends</h1>
    </div>
    <div id="counts" class="counts"></div>
    <span id="conn" class="conn" title="Live updates">connecting…</span>
    <button id="refresh" type="button" class="btn ghost">Refresh</button>
  </header>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <main id="board" class="board">
    <p class="empty">Loading…</p>
  </main>
</body>
</html>
